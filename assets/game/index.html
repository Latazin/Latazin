<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cartoon City: Idle Empire</title>
<style>
@font-face{font-family:'Lilita One';src:url('fonts/LilitaOne-Regular.ttf') format('truetype');font-weight:400;font-display:block}
@font-face{font-family:'Nunito';src:url('fonts/Nunito-Variable.ttf') format('truetype');font-weight:200 1000;font-display:block}
html,body{margin:0;padding:0}
</style>
</head>
<body>
<style>
/* Layout: tela cheia de jogo — cidade em canvas ocupa tudo; HUD fino + faixa de indicadores no topo, 7 botões embaixo, painéis como bottom-sheet */
:root{
  --ink:#2b2350; --ink-soft:#5d5487; --cream:#fff8ec; --cream2:#ffeccf; --line:#f0dcbc;
  --mint:#2fd08a; --mint-d:#179a62; --sun:#ffc53d; --sun-d:#d99000; --grape:#8e5cff; --grape-d:#5c30c9;
  --coral:#ff6b6b; --coral-d:#cf4040; --sky:#6fc8ff; --sky-d:#2f8fd6; --off:#d9d2e8; --off-d:#aaa1c4;
  --display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#79cfff;overscroll-behavior:none}
body{font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-size:14px}
#app{position:fixed;inset:0;overflow:hidden;background:#79cfff}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#cv.drag{cursor:grabbing}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

/* ---------- HUD topo ---------- */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;
  padding-top:calc(8px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;z-index:6}
#top>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:7px;background:var(--cream);border-radius:999px;padding:4px 12px 4px 4px;
  box-shadow:0 3px 0 var(--line),0 6px 14px rgba(43,35,80,.18);border:2px solid #fff;min-width:0}
.pill b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1;letter-spacing:.3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill small{display:block;font-weight:800;font-size:11px;color:var(--mint-d);line-height:1.1;white-space:nowrap}
.pill small.neg{color:var(--coral-d)}
#coinPill{flex:1 1 auto;max-width:210px}
#coinPill .txt{min-width:0;overflow:hidden}
.ico{flex:none;display:inline-block;border-radius:50%;width:30px;height:30px;position:relative}
.ico.coin{background:radial-gradient(circle at 35% 30%,#fff3b3 0 18%,#ffd34d 19% 60%,#e9a400 61%);box-shadow:inset 0 -3px 0 #c98400,0 0 0 2px #b97a00}
.ico.coin::after{content:"";position:absolute;inset:8px;border-radius:50%;border:2.5px solid #c98400;opacity:.65}
.ico.gem{border-radius:7px;width:22px;height:22px;margin:4px;transform:rotate(45deg);background:linear-gradient(135deg,#e2d2ff,#a77bff 45%,#6a38e0);box-shadow:0 0 0 2px #4d22b8,inset -3px -3px 0 rgba(0,0,0,.15)}
.ico.ess{border-radius:50%;width:22px;height:22px;margin:4px;background:radial-gradient(circle at 40% 35%,#fff,#9ff3ff 30%,#38b6ff 60%,#7b3cff);box-shadow:0 0 0 2px #3d2a9e,0 0 10px #9ff3ff}
#coinPill.pop .ico{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.25)}}
.icon-btn{flex:none;width:40px;height:40px;border-radius:14px;border:2px solid #fff;background:var(--cream);box-shadow:0 3px 0 var(--line),0 6px 14px rgba(43,35,80,.18);display:grid;place-items:center;padding:0}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.icon-btn svg{width:22px;height:22px}

/* faixa de indicadores da cidade */
#strip{position:absolute;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));display:flex;gap:5px;z-index:6;pointer-events:none;overflow-x:auto;scrollbar-width:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:4px}
#strip::-webkit-scrollbar{display:none}
#strip button{pointer-events:auto;flex:none;display:flex;align-items:center;gap:4px;border:2px solid #fff;background:rgba(255,248,236,.95);border-radius:12px;padding:2px 8px 2px 4px;font-weight:900;font-size:12px;box-shadow:0 2px 0 var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.3}
#strip svg{width:18px;height:18px;flex:none}
#strip button.warn{background:#ffe3e3;color:var(--coral-d);animation:shake 2.4s infinite}
#strip button.rank{background:var(--ink);color:#fff;border-color:var(--ink)}
@keyframes shake{0%,88%,100%{transform:none}91%{transform:translateX(-2px)}94%{transform:translateX(2px)}97%{transform:translateX(-1px)}}

/* banner de evento */
#evBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(94px + env(safe-area-inset-top,0px));z-index:5;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(330px,calc(100% - 32px))}
.ev{width:100%;box-sizing:border-box;background:linear-gradient(180deg,#ffe066,#ffb703);border:2px solid #fff;color:#6b3a00;border-radius:16px;padding:6px 12px 8px;box-shadow:0 4px 0 #d98a00,0 8px 18px rgba(0,0,0,.18);font-family:var(--display);font-size:15px;text-align:center;animation:evIn .45s cubic-bezier(.3,1.6,.5,1)}
.ev.rush{background:linear-gradient(180deg,#ff8fab,#ff4d6d);color:#fff;box-shadow:0 4px 0 #c9184a,0 8px 18px rgba(0,0,0,.18)}
.ev.blue{background:linear-gradient(180deg,#9be7ff,#38b6ff);color:#063a63;box-shadow:0 4px 0 #1a7fc4,0 8px 18px rgba(0,0,0,.18)}
.ev.purple{background:linear-gradient(180deg,#d6c2ff,#9d6bff);color:#fff;box-shadow:0 4px 0 #6a3fd1,0 8px 18px rgba(0,0,0,.18)}
.ev.story{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line),0 8px 18px rgba(0,0,0,.18);display:flex;gap:8px;align-items:center;text-align:left;padding:6px 10px;pointer-events:auto;cursor:pointer}
.ev.story .por{width:38px;height:38px;border-radius:12px}
.ev.story>div{flex:1;min-width:0}
.ev .bar{height:6px;border-radius:6px;background:rgba(0,0,0,.15);margin-top:4px;overflow:hidden}
.ev .bar i{display:block;height:100%;background:#fff;border-radius:6px}
.ev.story .bar{background:var(--cream2)}.ev.story .bar i{background:var(--grape)}
.ev .sub{font-family:var(--body);font-weight:800;font-size:11px;opacity:.85}
@keyframes evIn{from{transform:scale(.6) translateY(-10px);opacity:0}}
#heatChip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--ink);color:#fff;border-radius:16px;padding:6px 8px 6px 12px;display:flex;gap:10px;align-items:center;font-weight:900;font-size:12px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
#heatChip .lg{width:80px;height:8px;border-radius:4px}
#heatChip button{border:none;background:var(--coral);color:#fff;border-radius:10px;width:26px;height:26px;font-family:var(--display)}

/* lateral: baú e boosts */
#side{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(98px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:4}
#side.low{top:calc(160px + env(safe-area-inset-top,0px))}
.side-btn{width:54px;border-radius:16px;border:2px solid #fff;background:var(--cream);box-shadow:0 3px 0 var(--line),0 6px 14px rgba(43,35,80,.18);padding:4px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:1px}
.side-btn span{font-weight:900;font-size:10px;line-height:1.1;font-variant-numeric:tabular-nums;text-align:center}
.side-btn.ready{background:linear-gradient(180deg,#fff2b0,#ffd24a);animation:wiggle 1.6s infinite}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}75%{transform:rotate(-8deg)}85%{transform:rotate(8deg)}92%{transform:rotate(-4deg)}}
.chest-ico{width:34px;height:28px;position:relative}
.chest-ico::before{content:"";position:absolute;left:2px;right:2px;bottom:0;height:16px;border-radius:3px 3px 6px 6px;background:#c8742c;box-shadow:inset 0 -3px 0 #8f4a17,0 0 0 2px #6b3510}
.chest-ico::after{content:"";position:absolute;left:1px;right:1px;top:1px;height:12px;border-radius:10px 10px 3px 3px;background:#e08a3c;box-shadow:0 0 0 2px #6b3510,inset 0 3px 0 #f4ab63}
.chest-ico i{position:absolute;left:50%;top:9px;width:8px;height:9px;margin-left:-4px;background:#ffd34d;border-radius:2px;z-index:2;box-shadow:0 0 0 1.5px #6b3510}
.boost{font-size:10px;font-weight:900;background:var(--grape);color:#fff;border-radius:10px;padding:3px 6px;text-align:center;box-shadow:0 2px 0 var(--grape-d);font-variant-numeric:tabular-nums}

#homeBtn{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:4}
#zoomBtns{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(134px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;flex-direction:column;gap:6px}
#zoomBtns .icon-btn{width:40px;height:36px;font-family:var(--display);font-size:22px}

/* ---------- barra inferior ---------- */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(180deg,rgba(255,248,236,0),rgba(255,248,236,0) 10%,var(--cream) 30%);}
#nav button{position:relative;border:2px solid #fff;border-radius:15px;background:var(--cream);box-shadow:0 4px 0 var(--line),0 6px 12px rgba(43,35,80,.14);
  display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0 4px;min-width:0}
#nav button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
#nav button svg{width:25px;height:25px}
#nav button span{font-family:var(--display);font-size:10px;letter-spacing:.1px;color:var(--ink);white-space:nowrap;overflow:hidden;max-width:100%}
#nav button.on{background:linear-gradient(180deg,#fff,#ffe9b8)}
#nav .dot{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--coral);color:#fff;font-weight:900;font-size:11px;display:grid;place-items:center;border:2px solid #fff;padding:0 3px;font-style:normal}
.hl{animation:hl 1s infinite}
@keyframes hl{0%,100%{box-shadow:0 4px 0 var(--line),0 0 0 0 rgba(255,197,61,.9)}50%{box-shadow:0 4px 0 var(--line),0 0 0 8px rgba(255,197,61,0)}}

/* ---------- sheet ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;max-height:min(62vh,600px);display:flex;flex-direction:column;background:var(--cream);
  border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(43,35,80,.25);transform:translateY(105%);transition:transform .32s cubic-bezier(.3,1.3,.5,1);border-top:3px solid #fff}
#sheet.open{transform:none}
#sheet.tall{max-height:min(78vh,760px)}
#sheet header{flex:none;display:flex;align-items:center;gap:10px;padding-top:12px;padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#sheet h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;flex:1;letter-spacing:.3px;text-wrap:balance;min-width:0}
#sheet .grip{position:absolute;left:50%;top:6px;width:44px;height:5px;border-radius:5px;background:var(--line);margin-left:-22px}
.x-btn{flex:none;width:38px;height:38px;border-radius:12px;border:none;background:var(--coral);color:#fff;font-family:var(--display);font-size:20px;box-shadow:0 3px 0 var(--coral-d)}
.x-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--coral-d)}
#tabs{flex:none;display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs:empty{display:none}
#tabs button{flex:none;border:none;border-radius:12px;padding:7px 12px;background:var(--cream2);font-family:var(--display);font-size:13px;color:var(--ink-soft);box-shadow:0 2px 0 var(--line)}
#tabs button.on{background:var(--ink);color:#fff;box-shadow:0 2px 0 #160f33}
#body{overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 10px 8px 8px;box-shadow:0 3px 0 var(--line)}
.row.locked{opacity:.62}
.row.hot{box-shadow:0 3px 0 var(--sun),0 0 0 2px var(--sun)}
.row .th{flex:none;width:56px;height:56px;border-radius:14px;background:linear-gradient(180deg,#d9f3ff,#b9e5ff);display:grid;place-items:center;overflow:hidden}
.row .th img{width:56px;height:56px;display:block}
.row .info{flex:1;min-width:0}
.row h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15;letter-spacing:.2px}
.row p{margin:2px 0 0;font-size:12px;font-weight:700;color:var(--ink-soft);line-height:1.3}
.tag{display:inline-block;font-size:10.5px;font-weight:900;padding:1px 6px;border-radius:6px;background:var(--cream2);color:var(--ink-soft);margin:0 4px 2px 0;letter-spacing:.2px;white-space:nowrap}
.tag.g{background:#d8f8e8;color:var(--mint-d)}
.tag.p{background:#ece2ff;color:var(--grape-d)}
.tag.y{background:#fff0c2;color:#9a6100}
.tag.r{background:#ffe1e1;color:var(--coral-d)}
.tag.b{background:#dcefff;color:#1a6fb5}
.rar{font-size:10px;font-weight:900;padding:1px 6px;border-radius:6px;color:#fff;margin-right:4px;letter-spacing:.3px}
.rar.comum{background:#8a95a8}.rar.incomum{background:#3bb273}.rar.raro{background:#2f8fd6}.rar.épico{background:#8e3fd8}.rar.lendário{background:linear-gradient(90deg,#f2a900,#ff6b6b)}
.btn{flex:none;border:none;border-radius:14px;background:var(--mint);color:#fff;font-family:var(--display);font-size:14px;padding:8px 12px;box-shadow:0 4px 0 var(--mint-d);display:inline-flex;align-items:center;gap:5px;line-height:1.05;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.15);font-variant-numeric:tabular-nums}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--mint-d)}
.btn .mc{width:14px;height:14px;border-radius:50%;background:#ffd34d;box-shadow:0 0 0 1.5px #b97a00;flex:none}
.btn .mg{width:11px;height:11px;border-radius:3px;transform:rotate(45deg);background:#c9a8ff;box-shadow:0 0 0 1.5px #4d22b8;flex:none;margin:0 2px}
.btn .mr{width:13px;height:13px;border-radius:50%;background:#7df9ff;box-shadow:0 0 0 1.5px #1a6fb5;flex:none}
.btn .mx{width:10px;height:14px;clip-path:polygon(50% 0,100% 35%,50% 100%,0 35%);background:#c9f5ff;flex:none;box-shadow:inset 0 0 0 2px #38b6ff}
.btn.y{background:var(--sun);box-shadow:0 4px 0 var(--sun-d);color:#5a3500;text-shadow:none}
.btn.p{background:var(--grape);box-shadow:0 4px 0 var(--grape-d)}
.btn.r{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.btn.b{background:var(--sky);box-shadow:0 4px 0 var(--sky-d)}
.btn.w{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);text-shadow:none}
.btn.off,.btn:disabled{background:var(--off);box-shadow:0 4px 0 var(--off-d);color:#f7f4fc;text-shadow:none;cursor:not-allowed}
.btn.big{font-size:18px;padding:12px 18px;border-radius:18px;justify-content:center}
.btn.wide{width:100%;justify-content:center}
.seg{display:flex;gap:4px;background:var(--cream2);border-radius:12px;padding:3px;align-self:flex-start;flex-wrap:wrap}
.seg button{border:none;background:transparent;border-radius:9px;padding:5px 11px;font-family:var(--display);font-size:13px;color:var(--ink-soft)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.sec{font-family:var(--display);font-size:14px;color:var(--ink-soft);margin:6px 2px 0;letter-spacing:.4px;text-transform:uppercase}
.note{font-size:12.5px;font-weight:700;color:var(--ink-soft);line-height:1.45;margin:0 2px;max-width:65ch}
.prog{height:9px;border-radius:9px;background:var(--cream2);overflow:hidden;margin-top:5px}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--mint),#7ef0b7);max-width:100%}
.prog.y i{background:linear-gradient(90deg,#ffb703,#ffe066)}
.prog.p i{background:linear-gradient(90deg,#8e5cff,#c9a8ff)}
.prog.r i{background:linear-gradient(90deg,#ff6b6b,#ffa3a3)}
.prog.b i{background:linear-gradient(90deg,#38b6ff,#9be7ff)}
.fx{display:flex;flex-wrap:wrap;gap:4px}
.fx span{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;background:#fff;border-radius:8px;padding:2px 7px 2px 4px;box-shadow:0 2px 0 var(--line);white-space:nowrap}
.fx i{width:10px;height:10px;border-radius:50%;flex:none}

/* painel de prédio */
.bhead{display:flex;gap:12px;align-items:center}
.bhead .th{width:84px;height:84px;border-radius:20px;flex:none;background:linear-gradient(180deg,#d9f3ff,#b9e5ff);overflow:hidden}
.bhead .th img{width:84px;height:84px}
.bhead h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:#fff;border-radius:14px;padding:7px 8px;box-shadow:0 3px 0 var(--line);min-width:0}
.stat small{display:block;font-size:10px;font-weight:900;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px}
.stat b{font-family:var(--display);font-weight:400;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.upgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.upgrid .btn{flex-direction:column;gap:2px;padding:8px 4px;font-size:15px;justify-content:center}
.upgrid .btn small{font-family:var(--body);font-weight:900;font-size:10.5px;display:flex;align-items:center;gap:3px}
.why{display:flex;flex-direction:column;gap:4px}
.why div{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:12.5px;box-shadow:0 2px 0 var(--line)}
.why div b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.why .up b{color:var(--mint-d)}.why .dn b{color:var(--coral-d)}
.why i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--mint)}.why .dn i{background:var(--coral)}.why .nt i{background:var(--off-d)}

/* cartões de gestão */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card2{background:#fff;border-radius:16px;padding:9px 10px;box-shadow:0 3px 0 var(--line);min-width:0}
.card2 h4{margin:0;font-size:11px;font-weight:900;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:5px}
.card2 h4 svg{width:16px;height:16px}
.card2 b{display:block;font-family:var(--display);font-weight:400;font-size:19px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card2 p{margin:2px 0 0;font-size:11px;font-weight:800;color:var(--ink-soft);line-height:1.3}
.card2.warn{box-shadow:0 3px 0 #ffc4c4,0 0 0 2px #ffc4c4}
.card2.full{grid-column:1/-1}
.spark{width:100%;height:56px;display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:none;background:#fff;border-radius:18px;box-shadow:0 3px 0 var(--line);padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left}
.tile b{font-family:var(--display);font-weight:400;font-size:17px}
.tile span{font-size:11.5px;font-weight:800;color:var(--ink-soft);line-height:1.3}
.tile svg{width:34px;height:34px}

/* árvore de pesquisa */
.tree{overflow-x:auto;margin:0 -4px;padding:4px 4px 10px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.tree-in{display:grid;grid-template-columns:86px repeat(4,128px);gap:8px 20px;width:max-content;align-items:center}
.brn{font-family:var(--display);font-size:13px;line-height:1.1;display:flex;flex-direction:column;gap:2px}
.brn i{width:22px;height:6px;border-radius:3px}
.node{position:relative;border:none;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--line);padding:7px 9px;text-align:left;min-height:58px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.node::before{content:"";position:absolute;right:100%;top:50%;width:20px;height:3px;margin-top:-1px;background:var(--line)}
.node.first::before{display:none}
.node.done{background:#d8f8e8;box-shadow:0 3px 0 #9fe3c4}.node.done::before{background:var(--mint)}
.node.avail{background:#fff6d6;box-shadow:0 3px 0 var(--sun),0 0 0 2px var(--sun)}
.node.lock{opacity:.5}
.node.sel{outline:3px solid var(--grape);outline-offset:1px}
.node b{font-family:var(--display);font-weight:400;font-size:13px;line-height:1.1}
.node small{font-size:10.5px;font-weight:900;color:var(--ink-soft)}
.tdet{background:#fff;border-radius:18px;padding:12px;box-shadow:0 3px 0 var(--line);display:flex;flex-direction:column;gap:6px}
.tdet h3{margin:0;font-family:var(--display);font-weight:400;font-size:19px}

/* retratos */
.por{display:block;flex:none;width:56px;height:56px;border-radius:18px;overflow:hidden;box-shadow:0 3px 0 rgba(43,35,80,.18)}
.por .eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.por.talk .mouth{animation:talk .35s infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes talk{to{transform:scaleY(.5)}}
.qcard{background:#fff;border-radius:18px;padding:10px;box-shadow:0 3px 0 var(--line);display:flex;gap:10px;align-items:flex-start}
.qcard .info{flex:1;min-width:0}
.qcard h3{margin:0;font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15}
.qcard .who{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.qcard p{margin:3px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-soft);line-height:1.4}
.qcard .acts{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}

/* modal */
#modal{position:absolute;inset:0;z-index:20;background:rgba(32,24,72,.5);display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));backdrop-filter:blur(2px)}
#modal .card{width:min(390px,100%);box-sizing:border-box;max-height:84vh;overflow-y:auto;background:var(--cream);border-radius:28px;border:3px solid #fff;box-shadow:0 8px 0 var(--line),0 20px 50px rgba(0,0,0,.3);padding:20px 18px;display:flex;flex-direction:column;gap:10px;animation:cardIn .4s cubic-bezier(.3,1.5,.5,1);touch-action:pan-y}
@keyframes cardIn{from{transform:scale(.7);opacity:0}}
#modal h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;text-align:center;text-wrap:balance}
#modal .big-num{font-family:var(--display);font-size:38px;text-align:center;color:#d98a00;text-shadow:0 3px 0 #fff1c2;display:flex;align-items:center;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}
#modal p{margin:0;text-align:center;font-weight:700;color:var(--ink-soft);line-height:1.45}
#modal .speaker{display:flex;gap:12px;align-items:center}
#modal .speaker .por{width:72px;height:72px;border-radius:22px}
#modal .speaker p{text-align:left}
#modal .speaker small{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px}
.choice{width:100%;border:none;border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--line);padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.choice b{font-family:var(--display);font-weight:400;font-size:16px}
.choice span{font-size:12px;font-weight:800;color:var(--ink-soft);line-height:1.35}
.choice.pri{background:#e6fff2;box-shadow:0 4px 0 #9fe3c4}
.choice.off{opacity:.55}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;background:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 2px 0 var(--line);font-weight:800;font-size:13px}
.kv b{font-variant-numeric:tabular-nums;text-align:right}
.toggle{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 2px 0 var(--line);font-weight:800}
.sw{width:50px;height:28px;border-radius:14px;border:none;background:var(--off);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s cubic-bezier(.3,1.5,.5,1);box-shadow:0 2px 0 rgba(0,0,0,.15)}
.sw.on{background:var(--mint)}
.sw.on::after{transform:translateX(22px)}
textarea{width:100%;box-sizing:border-box;min-height:70px;border-radius:12px;border:2px solid var(--line);padding:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px;background:#fff;color:var(--ink);resize:vertical;user-select:text;-webkit-user-select:text}
.loot{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.loot>div{background:#fff;border-radius:14px;padding:8px 12px;box-shadow:0 3px 0 var(--line);font-family:var(--display);font-size:16px;display:flex;align-items:center;gap:6px;animation:cardIn .5s both}
.rar-comum{color:#4d8f5c}.rar-incomum{color:#2a9a5f}.rar-raro{color:#2f7fd6}.rar-épico{color:#8e3fd8}.rar-lendário{color:#d98a00}

/* coach / personagens */
#coach{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:7;display:flex;gap:10px;align-items:flex-end;pointer-events:none}

@keyframes bob{50%{transform:translateY(-4px)}}
#coach .bub{flex:1;min-width:0;background:#fff;border-radius:18px 18px 18px 4px;padding:10px 12px;box-shadow:0 4px 0 var(--line),0 10px 24px rgba(43,35,80,.2);font-weight:800;font-size:13.5px;line-height:1.4;pointer-events:auto;animation:cardIn .4s cubic-bezier(.3,1.5,.5,1)}
#coach .bub b.t{font-family:var(--display);font-weight:400;display:block;font-size:16px}
#coach .bub small{display:block;font-size:10.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px}
#coach .row2{display:flex;gap:8px;margin-top:6px;justify-content:flex-end;align-items:center}
#coach .skip{border:none;background:none;font-weight:800;color:var(--ink-soft);font-size:12px;text-decoration:underline}

#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(98px + env(safe-area-inset-top,0px));z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(340px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;font-weight:800;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:toast 2.6s forwards;text-align:center}
.toast.g{background:var(--mint-d)}.toast.p{background:var(--grape-d)}.toast.r{background:var(--coral-d)}
@keyframes toast{0%{transform:translateY(-12px) scale(.9);opacity:0}10%,80%{transform:none;opacity:1}100%{opacity:0;transform:translateY(-8px)}}

#banner{position:absolute;inset:0;z-index:15;display:grid;place-items:center;pointer-events:none}
#banner .in{text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:bannerIn 3.2s forwards}
#banner small{display:inline-block;font-family:var(--display);font-size:16px;color:#fff;background:var(--grape);border-radius:12px;padding:4px 12px;box-shadow:0 3px 0 var(--grape-d)}
#banner h1{margin:8px 0 0;font-family:var(--display);font-weight:400;font-size:clamp(30px,9vw,56px);color:#fff;line-height:1;text-wrap:balance;
  text-shadow:0 4px 0 var(--ink),0 -2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 10px 24px rgba(0,0,0,.35)}
@keyframes bannerIn{0%{transform:scale(.3) rotate(-6deg);opacity:0}12%{transform:scale(1.12) rotate(2deg);opacity:1}20%{transform:scale(1) rotate(0)}85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.1)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:14;transition:opacity .6s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media (min-width:760px){
  #sheet{left:auto;right:max(16px,env(safe-area-inset-right,0px));width:440px;bottom:96px;border-radius:26px;max-height:calc(100% - 200px);transform:translateX(120%)}

  #coach{right:auto;width:460px;bottom:96px}
  #heatChip{bottom:96px}
}

<script>
(()=>{'use strict';
/* =====================================================================
   UTIL
   ===================================================================== */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

function hash(n){let x=Math.imul((n|0)^0x9e3779b9,2654435761)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;return x>>>0;}
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc','QaDc','QiDc'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  const neg=n<0; if(neg) n=-n;
  let r;
  if(n<1000){ r=(n<10&&n%1>0.05)?n.toFixed(1):String(Math.floor(n)); }
  else{ const i=Math.floor(Math.log10(n)/3);
    if(i>=SUF.length) r=n.toExponential(2).replace('+','');
    else{ const v=n/Math.pow(1000,i); r=(v<10?v.toFixed(2):v<100?v.toFixed(1):String(Math.floor(v)))+SUF[i]; } }
  return (neg?'−':'')+r;
}
function pct(v){return Math.round(v*100)+'%';}
function sgn(v){return (v>=0?'+':'−')+Math.round(Math.abs(v)*100)+'%';}
function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  if(h) return h+'h '+String(m).padStart(2,'0')+'min'; if(m) return m+':'+String(ss).padStart(2,'0'); return ss+'s';}
function today(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
const SC=new Map();
function hexRGB(h){const n=parseInt(h.slice(1),16);return [n>>16&255,n>>8&255,n&255];}
function rgbHex(r,g,b){return '#'+((1<<24)|(Math.round(clamp(r,0,255))<<16)|(Math.round(clamp(g,0,255))<<8)|Math.round(clamp(b,0,255))).toString(16).slice(1);}
function shade(h,p){if(typeof h!=='string'||h[0]!=='#')return h;const k=h+'|'+p;let r=SC.get(k);if(r)return r;let [R,G,B]=hexRGB(h);
  if(p>0){R+=(255-R)*p;G+=(255-G)*p;B+=(255-B)*p;}else{R*=1+p;G*=1+p;B*=1+p;}r=rgbHex(R,G,B);SC.set(k,r);return r;}
function mix(a,b,t){const A=hexRGB(a),B=hexRGB(b);return rgbHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t));}
function ramp(stops){const cache=new Map();return h=>{let r=cache.get(h);if(r)return r;const [R,G,B]=hexRGB(h);const l=(0.3*R+0.59*G+0.11*B)/255;
  r=l<0.5?mix(stops[0],stops[1],l/0.5):mix(stops[1],stops[2],(l-0.5)/0.5);cache.set(h,r);return r;};}

};

const DIST=[
 {n:'Centro Histórico',cost:0,pref:1,g:'#8fd65a',deco:'round',acc:'#ff8fab',mech:'Patrimônio: monumentos e decorações dão turismo em dobro aqui.',ex:'Torre do Relógio e Museu',ch:'lucia'},

function upCost(b){const T=TYPES[b.t];if(b.t==='pref')return{c0:60,g:2.05};return{c0:T.cost*0.55*(T.cat==='pub'&&!T.inc?1.4:1),g:1.12};}
function bulkCost(b,n){const {c0,g}=upCost(b);const base=c0*Math.pow(g,b.lvl-1);return base*(Math.pow(g,n)-1)/(g-1);}
function maxAfford(b,coins){const {c0,g}=upCost(b);const base=c0*Math.pow(g,b.lvl-1);if(coins<base)return 0;return Math.max(1,Math.floor(Math.log(coins*(g-1)/base+1)/Math.log(g)));}
function buildCost(t){const T=TYPES[t];return T.cost*Math.pow(T.cat==='deco'?1.07:1.15,countType(t))*(tk('arq2')?.9:1);}
function buildTime(t){const c=TYPES[t].cost;if(c<1000||Date.now()<S.instUntil)return 0;return clamp(Math.round(Math.log10(c)*2.6),0,40);}
function typeLock(t){const T=TYPES[t];if(T.cat==='hidden')return 'Indisponível';if(T.ess&&S.ess<T.ess)return `Requer ${T.ess} de Essência Urbana`;
  if(!S.unlocked.includes(T.d))return `Requer o bairro ${DIST[T.d].n}`;if(T.only!==undefined&&!S.unlocked.includes(T.only))return `Exclusivo: ${DIST[T.only].n}`;
  if(cityRank()<T.rk)return `Cidade precisa ser ${RANKS[T.rk][1]} (${fmt(RANKS[T.rk][0])} hab.)`;if(T.req&&!tk(T.req))return `Pesquise: ${TECHM[T.req].n}`;return null;}
function spend(c){if(!(c>=0)||S.coins<c)return false;S.coins=Math.max(0,S.coins-c);return true;}
function earn(v){if(!(v>0)||!isFinite(v))return;S.coins+=v;S.run+=v;S.life+=v;dailyProg('earn',v);}
function offRate(){return (S.ess>=1?0.75:0.5)+(hasCU('banco')?0.25:0);}
function offCap(){return (S.ess>=10?8:4)*3600;}

function devScore(d){const plots=plotsOf(d);const bs=[];for(const [x,y] of plots){const b=occ.get(x+','+y);if(b&&isReady(b))bs.push(b);}
  const occR=bs.length/plots.length;const nd=bs.filter(b=>TYPES[b.t].cat!=='deco'&&b.t!=='prj');const avgL=nd.length?nd.reduce((a,b)=>a+b.lvl,0)/nd.length:0;
  const lvlF=clamp(Math.log10(avgL+1)/1.7,0,1);const amen=bs.filter(b=>['nat','deco'].includes(TYPES[b.t].cat)).length;const amenF=Math.min(1,amen/5);
  const svc=bs.some(b=>TYPES[b.t].tags.includes('service')||b.t==='pref')?1:0;const road=Math.max(0,ROADS.findIndex(r=>r.id===(S.road[d]||'asfalto')));
  return clamp(100*(.38*occR+.22*lvlF+.18*amenF+.1*svc+.12*(S.happy/100))+road*3+(S.dbonus[d]||0)+(d===0?8:0),0,100);}
function devLevel(s){return s<18?0:s<38?1:s<58?2:s<78?3:4;}
function updateDev(initial){for(const d of S.unlocked){const s=devScore(d);const l=devLevel(s);const old=C.devL[d];C.devS[d]=s;if(old!==l){C.devL[d]=l;groundDirty=true;dirty=true;
  if(!initial&&old!==undefined&&l>old&&!(S.devSeen[d]>=l)){S.devSeen[d]=l;toast(DIST[d].n+' agora é '+DEV[l][0]+'!','g');const gx=d%GXN,gy=Math.floor(d/GXN);const [wx,wy]=proj(gx*DS+3.5,gy*DS+3.5);burst(wx,wy-20,24);sfx('up');}}}}

const NATIVE=!!window.CCNative;function native(msg){try{if(window.CCNative)window.CCNative.postMessage(msg);}catch(e){}}
function save(){S.last=Date.now();const str=JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v);
  try{const prev=localStorage.getItem(SAVE_KEY);localStorage.setItem(SAVE_KEY,str);if(prev&&Math.random()<0.2)localStorage.setItem(BACK_KEY,prev);}catch(e){}
  native('save:'+str);}

function validState(o){return o&&typeof o==='object'&&Array.isArray(o.buildings)&&o.buildings.some(b=>b.t==='pref')&&isFinite(o.coins);}
function sanitize(o){const d=newState();const wasV1=!o.v||o.v<2;
  for(const k in d)if(!(k in o)||o[k]===null&&d[k]!==null)o[k]=d[k];for(const k in d.cnt)if(!(k in o.cnt))o.cnt[k]=d.cnt[k];for(const k in d.set)if(!(k in o.set))o.set[k]=d.set[k];
  o.coins=isFinite(o.coins)?Math.max(0,o.coins):0;o.gems=Math.max(0,Math.floor(o.gems||0));o.rp=isFinite(o.rp)?Math.max(0,o.rp):0;o.crys=isFinite(o.crys)?Math.max(0,o.crys):0;
  o.pop=isFinite(o.pop)?Math.max(0,o.pop):0;o.happy=isFinite(o.happy)?clamp(o.happy,0,100):55;
  o.buildings=o.buildings.filter(b=>TYPES[b.t]&&Number.isInteger(b.x)&&Number.isInteger(b.y)&&b.lvl>=1&&(b.t!=='prj'||PRJM[b.pid]));
  if(!o.unlocked.includes(0))o.unlocked.unshift(0);o.cos.own=o.cos.own||[];o.cos.eq=o.cos.eq||{};if(!Array.isArray(o.mods))o.mods=[];
  if(wasV1){o.v=2;o.seen2=false;if(!o.buildings.some(b=>b.t==='moinho')){const free=plotsOf(0).find(([x,y])=>!o.buildings.some(b=>b.x===x&&b.y===y));if(free)o.buildings.push({id:o.nid++,t:'moinho',x:free[0],y:free[1],lvl:1,ready:0});}
    o.pop=0;for(const b of o.buildings){const f=TYPES[b.t].f;if(f.pop)o.pop+=f.pop*(1+.1*(b.lvl-1))*.6;}}
  return o;}
function load(){const cands=[];const tryAdd=(key,s)=>{try{if(!s)return;const o=JSON.parse(s);if(validState(o))cands.push([key,o]);}catch(e){}};
  try{tryAdd(SAVE_KEY,localStorage.getItem(SAVE_KEY));}catch(e){}tryAdd('native',window.__nativeSave);
  if(cands.length){cands.sort((a,b)=>(b[1].last||0)-(a[1].last||0));S=sanitize(cands[0][1]);return cands[0][0];}
  try{tryAdd(BACK_KEY,localStorage.getItem(BACK_KEY));}catch(e){}if(cands.length){S=sanitize(cands[0][1]);return BACK_KEY;}return null;}

  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(dest||AU.sfx);o.start(t);o.stop(t+dur+.05);}

const CHD=[[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];const PENTA=[523.3,587.3,659.3,784,880,1046.5];let melIdx=2;
function musicTick(){if(!AU.c||!S.set.music)return;const beat=.42;while(AU.next<AU.c.currentTime+.4){const t=AU.next-AU.c.currentTime;const s=AU.step;const ch=CHD[Math.floor(s/8)%4];
  if(s%8===0)ch.forEach(f=>tone(f,beat*7.5,'sine',.08,t,0,AU.mus));if(s%2===0)tone(ch[0]/2,beat*1.6,'triangle',.12,t,0,AU.mus);
  if(Math.random()<.55){melIdx=clamp(melIdx+ri(-2,2),0,PENTA.length-1);tone(PENTA[melIdx],beat*.9,'triangle',.06,t,0,AU.mus);}if(s%4===2)tone(2200,.03,'square',.012,t,0,AU.mus);AU.step++;AU.next+=beat;}}

function toast(msg,cls){const t=document.createElement('div');t.className='toast '+(cls||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2700);while($('#toasts').children.length>4)$('#toasts').firstChild.remove();}
function bWorld(b){return proj(b.x+.5,b.y+.5);}
function autoPlot(t,prefD){const T=TYPES[t];let order=[];if(T.only!==undefined)order=[T.only];else{if(prefD!==undefined&&S.unlocked.includes(prefD))order.push(prefD);if(S.unlocked.includes(T.home))order.push(T.home);for(let i=S.unlocked.length-1;i>=0;i--)if(!order.includes(S.unlocked[i]))order.push(S.unlocked[i]);}
  let best=null,bs=-1e9;for(const d of order){if(!S.unlocked.includes(d))continue;for(const [x,y] of plotsOf(d)){if(!plotFree(x,y))continue;const s=t==='prj'?Math.random():placeScore(t,x,y)+(d===order[0]?.3:0);if(s>bs){bs=s;best=[x,y];}}if(best&&T.only!==undefined)break;}
  return best;}
let targetPlot=null;
function build(t){
  const lk=typeLock(t);if(lk){sfx('err');toast(lk,'r');return;}
  const T=TYPES[t];let plot=targetPlot&&plotFree(targetPlot[0],targetPlot[1])?targetPlot:null;
  if(plot&&T.only!==undefined&&distOf(...plot)!==T.only){toast('Só pode ser construído em '+DIST[T.only].n,'r');sfx('err');return;}
  if(!plot)plot=autoPlot(t);
  if(!plot){sfx('err');toast('Sem terrenos livres. Desbloqueie um bairro ou demole algo.','r');return;}
  if(T.cry&&S.crys<T.cry){sfx('err');toast('Faltam Cristais ('+T.cry+')','r');return;}
  const c=buildCost(t);if(!spend(c)){sfx('err');toast('Moedas insuficientes','r');return;}
  if(T.cry)S.crys-=T.cry;
  const bt=buildTime(t);const b={id:S.nid++,t,x:plot[0],y:plot[1],lvl:1,ready:Date.now()+bt*1000,born:TIME,bounce:0,bt0:bt};S.buildings.push(b);rebuildOcc();
  if(T.cat==='deco'){S.cnt.deco++;dailyProg('deco',1);}else{S.cnt.built++;dailyProg('build',1);}
  for(const tg of T.tags)S.cnt.tags[tg]=(S.cnt.tags[tg]||0)+1;
  targetPlot=null;const [wx,wy]=bWorld(b);camTo(wx,wy-20);burst(wx,wy-10,18);sfx('build');vib(20);
  if(bt===0)finishBuild(b,true);else{b._wasBusy=true;floatText(wx,wy-40,'Obra: '+bt+'s','#ffffff',13);}
  b.nextBub=rnd(8,18);dirty=true;if(S.tut===1&&(t==='cafe'||t==='padaria')){S.tut=2;tutRender();}
  refreshPanel();checkAch();save();}

  if(b.t==='prj'){const st=S.prj[b.pid];if(st){st.s++;const p=PRJM[b.pid];if(st.s>=3){S.cnt.prjDone++;startCeremony(b,p.n,true);showBanner(p.n,'Projeto concluído!');sfx('unlock');groundDirty=true;syncAgents(true);say(p.ch,'Conseguimos! '+p.n+' está pronto. '+p.fx+'.',6);}
    else{toast(p.n+': etapa "'+p.st[st.s-1].n+'" concluída','g');sparkle(wx,wy-30,16);sfx('up');}}dirty=true;refreshPanel();return;}
  S.seenT[b.t]=1;checkCollections();

function grantChest(src){const base=Math.max(50,ipsBase*rnd(60,180));const g=ri(2,6)+(src==='super'?6:0);const L=[];
  const coins=src==='super'?base*3:base;earn(coins);S.gems+=g;L.push(['coin',fmt(coins)+' moedas']);L.push(['gem',g+' joias']);
  if(Math.random()<.25||src==='super'){const rp=Math.max(10,Math.round(C.rp*90));S.rp+=rp;L.push(['rp',rp+' de pesquisa']);}

function rollCos(){let tot=0;for(const c of COS)tot+=RAR_W[c.r];let r=Math.random()*tot;for(const c of COS){r-=RAR_W[c.r];if(r<=0)return c;}return COS[0];}

/* ---------- projetos ---------- */
function prjState(id){return S.prj[id]||(S.prj[id]={s:0,bid:0});}
function reqCheck(r){switch(r[0]){
  case 'tech':return [tk(r[1]),'Pesquisa: '+TECHM[r[1]].n];case 'pop':return [S.pop>=r[1],fmt(r[1])+' habitantes'];
  case 'surplus':return [C.pwP-C.pwC>=r[1],'Energia sobrando: '+fmt(r[1])];case 'districts':return [S.unlocked.length>=r[1],r[1]+' bairros abertos'];
  case 'tag':return [countTagReady(r[1])>=r[2],r[2]+'× '+TAGN[r[1]]];case 'type':return [S.buildings.some(b=>b.t===r[1]&&isReady(b)),TYPES[r[1]].n+' construída'];
  case 'techn':return [Object.keys(S.tech).length>=r[1],r[1]+' pesquisas concluídas'];case 'happy':return [S.happy>=r[1],'Felicidade '+r[1]+'%'];}return [false,'?'];}
function prjBusy(id){const st=S.prj[id];if(!st||!st.bid)return false;const b=S.buildings.find(x=>x.id===st.bid);return !!(b&&b.ready>Date.now());}
function startStage(id){const p=PRJM[id],st=prjState(id);if(st.s>=3||prjBusy(id))return;const g=p.st[st.s];
  for(const r of g.req){const [ok,txt]=reqCheck(r);if(!ok){sfx('err');toast('Falta: '+txt,'r');return;}}
  if(g.cry&&S.crys<g.cry){sfx('err');toast('Faltam Cristais ('+g.cry+')','r');return;}if(g.rp&&S.rp<g.rp){sfx('err');toast('Pesquisa insuficiente','r');return;}
  let b=st.bid&&S.buildings.find(x=>x.id===st.bid);let plot=null;if(!b){plot=autoPlot('prj',{aero:6,metro:1,campus:5,jardins:3,fusao:2,elev:9}[id]);if(!plot){sfx('err');toast('Sem terreno livre para o projeto','r');return;}}
  if(!spend(g.cost)){sfx('err');toast('Moedas insuficientes','r');return;}if(g.cry)S.crys-=g.cry;if(g.rp)S.rp-=g.rp;
  const tt=Date.now()<S.instUntil?2:g.t;
  if(!b){b={id:S.nid++,t:'prj',pid:id,x:plot[0],y:plot[1],lvl:1,ready:0,born:TIME,bt0:tt};S.buildings.push(b);st.bid=b.id;rebuildOcc();}
  b.ready=Date.now()+tt*1000;b.bt0=tt;b._wasBusy=true;const [wx,wy]=bWorld(b);camTo(wx,wy-20);burst(wx,wy-10,22);sfx('build');toast('Obra iniciada: '+g.n,'g');dirty=true;refreshPanel();save();}

  ev=null;sev=null;renderEvBar();worldCoins=[];superChest=null;rebuildOcc();groundDirty=true;syncAgents(true);dirty=true;closeSheet();C.devL=[];updateDev(true);
  const f=$('#flash');f.style.opacity=1;setTimeout(()=>f.style.opacity=0,350);showBanner('+'+g+' Essência Urbana','Renascimento!');screenConfetti(160);sfx('unlock');

  if(sev&&sev.obj){const o=sev.obj;o.prog=o.k==='cap'?C.hcap-o.base:o.k==='deco'?S.cnt.deco-o.base:o.k==='visit'?C.V:o.prog;
    if(o.prog>=o.need){const r=o.reward;const L=[];if(r.gems){S.gems+=r.gems;L.push(r.gems+' joias');}if(r.cs){const v=cost(r.cs);earn(v);L.push(fmt(v)+' moedas');}
      if(r.perm){S.mods.push({k:r.perm[0],v:r.perm[1],perm:true,label:r.perm[2]});L.push(r.perm[2]);dirty=true;}
      showBanner('Objetivo cumprido!',EV_T(sev.id));screenConfetti(60);sfx('unlock');toast('+'+L.join(', '),'p');eventTap();if(r.chest)setTimeout(()=>grantChest('event'),800);sev=null;renderEvBar();}
    else if(TIME>o.until){toast('O tempo acabou. Fica para a próxima!');sev=null;renderEvBar();}}
  else if(sev&&!sev.pending&&!sev.obj){sev=null;renderEvBar();}
  if(!sev&&S.tut>=4){sevTimer-=dt;if(sevTimer<=0){sevTimer=rnd(150,240);const pool=SEV.filter(e=>charUnlocked(e.ch)&&e.ok());if(pool.length){let tot=0;for(const e of pool)tot+=e.w;let r=Math.random()*tot;let e=pool[0];for(const x of pool){r-=x.w;if(r<=0){e=x;break;}}
    sev={id:e.id,pending:true,wait:45};sfx('event');renderEvBar();say(e.ch,'<b>'+e.t+'</b> Tenho uma proposta para você!',6,['Ver',()=>openEvent()]);}}}
  if(weather&&TIME>weather.until)weather=null;}

function stripRender(){const h=Math.round(S.happy);const r=cityRank();let s=`<button class="rank" data-go="city">${RANKS[r][1]}</button>`;

  const sur=C.pwP-C.pwC;s+=`<button data-go="city" class="${C.powEff<1?'warn':''}">${ICO.pw}${sur>=0?'+':''}${fmt(sur)}</button>`;
  if(C.gd>0)s+=`<button data-go="city" class="${C.supply<.6?'warn':''}">${ICO.goods}${pct(C.supply)}</button>`;
  if(C.cg>.05)s+=`<button data-go="city" class="warn">${ICO.traffic}${pct(C.trafD/C.trafC)}</button>`;

function agentTargets(){const n=S.unlocked.length;return {car:clamp(Math.round(4+n*2+C.trafD*.5),6,34),bus:(tk('tra2')||countType('onibus'))?clamp(2+C.transit*2,0,8):0,truck:clamp(Math.round(C.deliv/6),0,10),ped:clamp(Math.round(8+S.pop/25+C.V/20),8,60)};}

    if(diff>0)for(let i=0;i<diff;i++){const a=newAgent(k);if(a)agents.push(a);}else if(diff<0){for(let i=0;i<-diff;i++){const idx=agents.indexOf(cur[i]);if(idx>=0)agents.splice(idx,1);}}}}

  if(ev&&ev.k==='mega'&&ev.bid===b.id){const y=cy-top-26+Math.sin(TIME*5)*5;const c=`hsl(${(TIME*200)%360},100%,60%)`;poly([[cx,y+12],[cx-10,y],[cx-4,y],[cx-4,y-10],[cx+4,y-10],[cx+4,y],[cx+10,y]],c);glow(cx,y,24,'rgba(255,255,255,.6)');}
  if(b.bub>0){const bob=Math.sin(TIME*3+b.id)*3;const pop=Math.min(1,(TIME-(b.bubT||0))*4);const bx=cx,by=cy-top-14+bob;b._bx=bx;b._by=by;
    X.save();X.translate(bx,by);X.scale(pop,pop);X.beginPath();X.arc(0,0,13,0,Math.PI*2);X.fillStyle='rgba(255,255,255,.92)';X.fill();X.strokeStyle=OUT;X.lineWidth=1.5;X.stroke();X.beginPath();X.moveTo(-4,11);X.lineTo(0,17);X.lineTo(4,11);X.fill();X.restore();
    drawCoin(bx,by,8*pop,TIME*3+b.id);if(S.tut===0&&b.t==='casa'){const s=1+Math.sin(TIME*8)*.15;X.beginPath();X.arc(bx,by,18*s,0,Math.PI*2);X.strokeStyle='#ffd23f';X.lineWidth=3;X.stroke();}}
  else b._bx=undefined;}
function skinFx(b,cx,cy,top){const k=b.skin;if(k==='doces'){for(let i=0;i<8;i++){const h=hash(b.id*9+i);ell(cx-14+(h%28),cy-top*.3-((h>>5)%Math.max(1,Math.floor(top*.6))),1.3,.7,COL4[i%4],false);}}
  else if(k==='brinq'){for(let i=0;i<3;i++){const p=P(cx,cy,-.3+i*.3,.4,top*.3);ell(p[0],p[1],1.8,1.8,'#c0c8d8');}}
  else if(k==='neon'){glow(cx,cy-top*.5,top*.7,'rgba(255,79,216,.35)');}
  else if(k==='fant'){if(Math.random()<.1&&!PREVIEW)parts.push({k:'spark',x:cx+rnd(-20,20),y:cy-rnd(5,top),vx:0,vy:-10,t:0,life:.8,c:'#c9a8ff'});}
  else if(k==='scifi'){const y=cy-((TIME*20+b.id*7)%Math.max(10,top));line(cx-18,y,cx+18,y,'rgba(76,240,255,.8)',1.4);glow(cx,y,12,'rgba(76,240,255,.5)');}}
function drawFog(d,cx,cy){const D=DIST[d];let a=1;if(unlockAnim&&unlockAnim.d===d)a=1-clamp(unlockAnim.t/1.6,0,1);if(a<=0)return;
  X.globalAlpha=a*.92;for(let i=0;i<9;i++){const h=hash(d*50+i);const ox=(h%160)-80,oy=((h>>8)%70)-35;const r=22+(h>>4)%18;const fy=Math.sin(TIME*.6+i)*3;X.fillStyle=i%3?'#ffffff':'#eef0ff';X.beginPath();X.arc(cx+ox,cy+oy-r*.4+fy-(1-a)*40,r*(1+(1-a)*.5),0,Math.PI*2);X.fill();}
  X.globalAlpha=a;const y=cy-26;rr(cx-62,y-16,124,40,12);X.fillStyle='#fff8ec';X.fill();X.strokeStyle='#2b2350';X.lineWidth=2;X.stroke();
  X.fillStyle='#ffd23f';rr(cx-54,y-6,16,14,3);X.fill();X.stroke();X.beginPath();X.arc(cx-46,y-6,5,Math.PI,0);X.strokeStyle='#2b2350';X.lineWidth=2.5;X.stroke();
  X.font='11px "Lilita One",sans-serif';X.textAlign='left';X.textBaseline='middle';X.fillStyle='#2b2350';X.fillText(D.n.length>19?D.n.slice(0,18)+'…':D.n,cx-32,y-3);
  X.font='10px "Nunito",sans-serif';X.fillStyle='#7a5a00';X.fillText((D.ess&&S.ess<D.ess)?D.ess+' Essência':fmt(D.cost)+' moedas',cx-32,y+11);X.globalAlpha=1;}

function afterLoad(){rebuildOcc();C.devL=[];updateDev(true);groundDirty=true;syncAgents(true);dirty=true;recalc();recalc();dispCoins=S.coins;ev=null;sev=null;renderEvBar();
  for(const b of S.buildings){b.bub=0;b.nextBub=rnd(4,16);if(b.ready>Date.now())b._wasBusy=true;}
  const [wx,wy]=bWorld(pref());cam.x=wx;cam.y=wy-20;cam.z=W<500?1.25:1.4;closeSheet();updateDots();tutRender();applyVol();stripRender();}
function offlineGain(sec,initial){sec=clamp(sec,0,offCap());if(sec<30)return;recalc();const v=Math.max(0,ipsBase)*sec*offRate();const rp=C.rp*sec*offRate();
  S.rp+=rp;S.crys+=C.crys*sec*offRate();const tgt=C.hcap*(.5+.5*S.happy/100)*C.mpop;S.pop=lerp(S.pop,tgt,Math.min(1,sec/60));if(v>0)earn(v);
  const d=today();let daily='';if(initial&&S.streak.day!==d){const y=new Date(Date.now()-864e5);const yd=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();S.streak.n=S.streak.day===yd?S.streak.n%7+1:1;S.streak.day=d;const g=4+S.streak.n*2;S.gems+=g;daily=`<div class="kv"><span>Bônus diário · dia ${S.streak.n} de 7</span><b>+${g} joias</b></div>`;}
  openModal(`<h2>Bem-vindo de volta!</h2><p>Você ficou fora por <b>${fmtTime(sec)}</b>. A cidade continuou trabalhando:</p><div class="big-num"><i class="ico coin"></i>+${fmt(v)}</div>${rp>=1?`<div class="kv"><span>Pesquisa acumulada</span><b>+${fmt(rp)}</b></div>`:''}${daily}<p class="note" style="text-align:center">Renda offline: ${Math.round(offRate()*100)}% da produção, até ${offCap()/3600}h.</p><button class="btn big" data-m="close">Continuar</button>`);
  sfx('chest');save();}
function boot(){resize();const src=load();afterLoad();
  if(src){const away=(Date.now()-(S.last||Date.now()))/1000;if(away>30)offlineGain(away,true);else{const d=today();if(S.streak.day!==d){S.streak.day=d;S.streak.n=1;S.gems+=6;toast('Bônus diário: +6 joias','p');}}}
  else{S.streak.day=today();S.streak.n=1;}
  if(src===BACK_KEY)toast('Progresso recuperado do backup','g');ensureDaily();updHUD();
  let last=performance.now(),lastWall=Date.now();
  function frame(now){const wall=Date.now();let wd=(wall-lastWall)/1000;lastWall=wall;if(wd<0)wd=0;if(wd>30)offlineGain(wd,false);else econ(Math.min(wd,5));
    let dt=(now-last)/1000;last=now;dt=clamp(dt,0,.1);update(dt);render();requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});window.addEventListener('pagehide',save);
  window.__cc={S:()=>S,C,build,upgrade,startEvent,unlockDistrict,tap,econ,recalc,doPrestige,essGain,research,startStage,openSheet,setTarget:p=>targetPlot=p,chooseEv,openEvent,
    forceSev:id=>{sev={id,pending:true,wait:45};renderEvBar();},openB:id=>openBuilding(S.buildings.find(b=>b.id===id)),storm:()=>{weather={k:'storm',until:TIME+30};},night:()=>{TIME=120;},finishAll:()=>{for(const b of S.buildings)if(b.ready>Date.now())b.ready=Date.now()-1;},get ips(){return ips;}};}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{for(const k in thumbs)delete thumbs[k];});
window.__ccBack=()=>{if(!$('#modal').hidden){closeModal();return 'handled';}if(sheetMode){closeSheet();targetPlot=null;return 'handled';}if(heatMode){heatMode=null;renderHeatChip();return 'handled';}return 'none';};
if(window.CCNative){let started=false;const go=()=>{if(started)return;started=true;boot();};
  window.__ccRestore=s=>{if(typeof s==='string'&&s.length)window.__nativeSave=s;go();};native('ready');setTimeout(go,2000);}
else boot();
})();
