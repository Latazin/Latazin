name: cartoon_city
description: "Cartoon City: Idle Empire — idle city builder cartoon."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.4
  google_mobile_ads: '>=5.3.1'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/game/index.html
    - assets/game/version.txt
    - assets/icon/icon_foreground.png
  fonts:
    - family: Lilita
      fonts:
        - asset: assets/game/fonts/LilitaOne-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true
