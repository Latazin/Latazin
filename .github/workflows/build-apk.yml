name: Gerar APK

on:
  push:
    paths-ignore:
      - 'assets/game/**'
      - 'game_src/**'
      - 'build_game.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar pastas Android e iOS
        run: flutter create . --org com.cartooncity --project-name cartoon_city --platforms android,ios

      - name: Nome do app e acesso à internet (para atualizações)
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read().replace('android:label="cartoon_city"','android:label="Cartoon City"')
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          open(p,'w').write(s)
          PY

      - name: Assinatura fixa (permite atualizar por cima sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp android-keys/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --build-number=$((100 + ${{ github.run_number }}))

      - uses: actions/upload-artifact@v4
        with:
          name: cartoon-city-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cartoon City (build ${{ github.run_number }})
          body: Baixe o arquivo app-release.apk no celular Android e toque nele para instalar.
          files: build/app/outputs/flutter-apk/app-release.apk
