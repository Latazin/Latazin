name: Gerar APK

on:
  push:
    paths-ignore:
      - 'assets/game/**'
      - 'game_src/**'
      - 'build_game.sh'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar pastas Android e iOS
        run: flutter create . --org com.cartooncity --project-name cartoon_city --platforms android,ios

      - name: Nome do app, internet e ID do AdMob
        run: |
          python3 - <<'PY'
          import re
          admob_id = re.search(r"admobAppId\s*=\s*'([^']+)'", open('lib/ad_ids.dart').read()).group(1)
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read().replace('android:label="cartoon_city"','android:label="Cartoon City"')
          if 'android.permission.INTERNET' not in s:
              s=s.replace('<application','<uses-permission android:name="android.permission.INTERNET"/>\n    <application',1)
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              meta=f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{admob_id}"/>\n        <activity'
              s=s.replace('<activity', meta, 1)
          open(p,'w').write(s)
          PY

      - name: Assinatura fixa (permite atualizar por cima sem desinstalar)
        run: |
          python3 - <<'PY'
          import os,re
          kts='android/app/build.gradle.kts'; gr='android/app/build.gradle'
          if os.path.exists(kts):
              p=kts; block='''    signingConfigs {
                  getByName("debug") {
                      storeFile = file("../../android-keys/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          '''
          else:
              p=gr; block='''    signingConfigs {
                  debug {
                      storeFile file("../../android-keys/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''
          s=open(p).read()
          s=re.sub(r'(\nandroid\s*\{\n)', lambda m: m.group(1)+block, s, count=1)
          open(p,'w').write(s)
          print(s)
          PY

      - name: Desativar minificação/R8 no release (estava quebrando o WorkManager/Room e crashando o app ao abrir)
        run: |
          python3 - <<'PY'
          import os,re
          kts='android/app/build.gradle.kts'; gr='android/app/build.gradle'
          p = kts if os.path.exists(kts) else gr
          s = open(p).read()
          if p.endswith('.kts'):
              s = re.sub(r'isMinifyEnabled\s*=\s*true', 'isMinifyEnabled = false', s)
              s = re.sub(r'isShrinkResources\s*=\s*true', 'isShrinkResources = false', s)
              if 'isMinifyEnabled' not in s:
                  s = re.sub(r'(release\s*\{)', r'\1\n            isMinifyEnabled = false\n            isShrinkResources = false', s, count=1)
          else:
              s = re.sub(r'minifyEnabled\s+true', 'minifyEnabled false', s)
              s = re.sub(r'shrinkResources\s+true', 'shrinkResources false', s)
              if 'minifyEnabled' not in s:
                  s = re.sub(r'(release\s*\{)', r'\1\n            minifyEnabled false\n            shrinkResources false', s, count=1)
          open(p,'w').write(s)
          print(s)
          PY

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Build APK
        id: build
        run: |
          set -o pipefail
          flutter build apk --release --build-number=$((100 + ${{ github.run_number }})) 2>&1 | tee /tmp/build_log.txt

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: cartoon-city-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar para download
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Cartoon City (build ${{ github.run_number }})
          body: Baixe o arquivo app-release.apk no celular Android e toque nele para instalar.
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar log de erro (se o build falhar)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log-${{ github.run_number }}
          name: Log de erro (build ${{ github.run_number }})
          body: Build falhou. Veja build_log.txt.
          files: /tmp/build_log.txt
